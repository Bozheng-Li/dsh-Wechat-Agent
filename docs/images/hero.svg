<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" fill="none">
  <title>微信 Agent — 把人设、记忆与提醒带进微信</title>
  <desc>青玉与石墨色的微信 Agent 工作台。聊天示例连接会话记忆、定时提醒与工作任务，支持全局助手设定和三十张内置表情，运行在 DeepSeek Harness。</desc>
  <defs>
    <clipPath id="hero-frame"><rect width="1440" height="590" rx="24"/></clipPath>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071216" flood-opacity=".18"/></filter>
  </defs>
  <g clip-path="url(#hero-frame)">
    <rect width="1440" height="590" fill="#F2F6F6"/>
    <rect x=".5" y=".5" width="1439" height="589" rx="23.5" stroke="#D7E3E5"/>
    <rect x="772" y="28" width="640" height="456" rx="20" fill="#15242B"/>
    <path d="M70 474H723" stroke="#D7E3E5"/>
    <g font-family="Segoe UI, Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif">
      <rect x="66" y="60" width="46" height="46" rx="14" fill="#087F79"/>
      <path d="M101 82c0 6-5 10-11 10-2 0-3.6-.3-5-1l-6 2 1.5-5.3a9 9 0 0 1-2-5.7c0-5.5 5-10 11-10S101 76.5 101 82Z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="84" cy="82" r="1.4" fill="#FFFFFF"/><circle cx="90" cy="82" r="1.4" fill="#FFFFFF"/><circle cx="96" cy="82" r="1.4" fill="#FFFFFF"/>
      <text x="128" y="82" font-size="23" font-weight="650" fill="#20353B">微信 Agent</text>
      <text x="129" y="102" font-size="11" letter-spacing="1.7" fill="#60767C">DEEPSEEK HARNESS PLUGIN</text>
      <text x="66" y="202" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#20353B">让微信，多一个</text>
      <text x="66" y="282" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#087F79">懂你的伙伴。</text>
      <text x="70" y="336" font-size="21" fill="#516970">会聊天，有记忆，也记得你的约定。</text>
      <rect x="68" y="384" width="298" height="38" rx="9" fill="#FFFFFF" stroke="#D7E3E5"/>
      <g transform="translate(85 396)" stroke="#087F79" stroke-width="1.5" stroke-linejoin="round"><rect width="15" height="10" rx="2"/><path d="M7.5 10v4m-4 0h8"/></g>
      <text x="112" y="408" font-size="14" fill="#516970">Windows x64 · DSH 0.2.1-rc.5</text>
      <text x="805" y="66" font-size="12" letter-spacing="1" fill="#AFC2C8">从一句话，到一件事</text>
      <circle cx="1293" cy="62" r="4" fill="#79D8C7"/>
      <text x="1306" y="66" font-size="11" fill="#AFC2C8">微信连接</text>
      <path d="M805 86H1379" stroke="#334B54"/>
      <g filter="url(#card-shadow)"><rect x="808" y="110" width="568" height="207" rx="14" fill="#20353B" stroke="#3A5059"/></g>
      <text x="829" y="139" font-size="12" fill="#AFC2C8">会话 · 小胖</text>
      <path d="M829 154H1355" stroke="#3A5059"/>
      <rect x="829" y="174" width="375" height="47" rx="12" fill="#15242B"/>
      <path d="m835 210-8 12 19-5" fill="#15242B"/>
      <text x="849" y="204" font-size="19" fill="#E5F0F2">小胖，一分钟后提醒我吃饭。</text>
      <rect x="1006" y="240" width="348" height="47" rx="12" fill="#79D8C7"/>
      <path d="m1344 275 12 13-21-7" fill="#79D8C7"/>
      <text x="1027" y="270" font-size="19" font-weight="550" fill="#102D2B">好，一分钟后提醒你。</text>
      <path d="m973 261 5 5 9-10" stroke="#79D8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1092 317v29m-189 16v-16h378v16" stroke="#55877F" stroke-width="1.5"/>
      <circle cx="1092" cy="345" r="4" fill="#79D8C7"/>
      <g stroke="#3A5059" fill="#1A2C33"><rect x="812" y="362" width="181" height="82" rx="10"/><rect x="1003" y="362" width="181" height="82" rx="10"/><rect x="1194" y="362" width="181" height="82" rx="10"/></g>
      <g stroke="#79D8C7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M830 382h12v16h-12zm4 5h4m-4 5h4m4-10 4 3v16h-12"/><circle cx="1028" cy="390" r="8"/><path d="M1028 385v5l4 2"/><rect x="1211" y="385" width="17" height="13" rx="2"/><path d="M1216 385v-4h7v4m-12 6h17m-8-1v3"/></g>
      <text x="858" y="395" font-size="15" font-weight="600" fill="#E5F0F2">会话记忆</text>
      <text x="1049" y="395" font-size="15" font-weight="600" fill="#E5F0F2">定时提醒</text>
      <text x="1240" y="395" font-size="15" font-weight="600" fill="#E5F0F2">工作任务</text>
      <text x="831" y="425" font-size="12" fill="#AFC2C8">记住各自的上下文</text>
      <text x="1022" y="425" font-size="12" fill="#AFC2C8">在约定的时间提醒</text>
      <text x="1213" y="425" font-size="12" fill="#AFC2C8">查看进度与成果</text>
      <text x="70" y="516" font-size="17" font-weight="600" fill="#20353B">一位全局助手</text>
      <text x="70" y="542" font-size="13" fill="#60767C">名字、唤醒词与表达偏好</text>
      <path d="M333 503v43M658 503v43M1040 503v43" stroke="#D7E3E5"/>
      <text x="367" y="517" font-size="23" font-weight="650" fill="#087F79">30</text>
      <text x="405" y="516" font-size="16" font-weight="600" fill="#20353B">张精选表情</text>
      <text x="367" y="542" font-size="13" fill="#60767C">让回复多一点表情</text>
      <text x="693" y="516" font-size="17" font-weight="600" fill="#20353B">记忆与约定</text>
      <text x="693" y="542" font-size="13" fill="#60767C">在自己的工作目录里</text>
      <text x="1073" y="516" font-size="17" font-weight="600" fill="#20353B">消息与结果，都能核对</text>
      <text x="1073" y="542" font-size="13" fill="#60767C">连接 · 执行 · 微信回执</text>
    </g>
  </g>
</svg>
